<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Apart Movement &mdash; Rankings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=Cinzel:wght@400;700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=Cinzel:wght@400;700;900&display=swap"></noscript>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --gold:#D4A84A;--gold-l:#E8C060;--gold-d:rgba(212,168,74,.22);
      --ink:#060504;--ink2:#100e09;--ink3:#181510;
      --text:#F2EEE6;--dim:rgba(242,238,230,.52);--dimmer:rgba(242,238,230,.26);
    }
    html,body{width:100%;min-height:100vh;background:var(--ink);color:var(--text);font-family:'Space Grotesk',sans-serif;overflow-x:hidden}
    a{color:inherit;text-decoration:none}

    /* EMBER CANVAS */
    #ember-c{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.65}

    /* BACK BUTTON — prominent top */
    .back-bar{position:relative;z-index:10;display:flex;justify-content:center;padding:max(env(safe-area-inset-top,0px),28px) 24px 0}
    .back-bar a{display:inline-flex;align-items:center;gap:8px;padding:13px 32px;background:linear-gradient(135deg,#2a1a00,#5a3c10,#2a1a00);border:1.5px solid rgba(212,168,74,.4);border-radius:6px;color:var(--gold-l);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;transition:border-color .2s,box-shadow .2s}
    .back-bar a:hover{border-color:var(--gold);box-shadow:0 0 24px rgba(212,168,74,.28)}

    /* HEADER */
    .hdr{position:relative;z-index:5;text-align:center;padding:28px 24px 36px;border-bottom:1px solid rgba(212,168,74,.12)}
    .hdr-logo{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:rgba(212,168,74,.5);margin-bottom:14px}
    .hdr-title{font-family:'Bebas Neue',impact,sans-serif;font-size:clamp(52px,14vw,88px);letter-spacing:.04em;line-height:.9;color:var(--gold);text-shadow:0 0 40px rgba(212,168,74,.35)}
    .hdr-sub{font-size:13px;color:var(--dim);margin-top:12px}

    /* SEARCH */
    .search-wrap{position:relative;z-index:5;max-width:520px;margin:24px auto 0;padding:0 20px}
    .search-input{width:100%;background:var(--ink2);border:1px solid rgba(212,168,74,.18);border-radius:8px;padding:13px 18px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:15px;outline:none;transition:border-color .2s;-webkit-appearance:none}
    .search-input:focus{border-color:rgba(212,168,74,.45)}
    .search-input::placeholder{color:var(--dimmer)}

    /* BOARD */
    .board-wrap{position:relative;z-index:5;max-width:520px;margin:16px auto 0;padding:0 20px 80px}
    .board-row{display:flex;align-items:center;gap:14px;background:var(--ink2);border:1px solid rgba(212,168,74,.1);border-radius:10px;padding:14px 16px;margin-bottom:7px;transition:border-color .2s,box-shadow .2s}
    .board-row:hover{border-color:rgba(212,168,74,.28)}
    .board-row.top1{border-color:rgba(212,168,74,.45);box-shadow:0 0 28px rgba(212,168,74,.12),0 4px 16px rgba(0,0,0,.5)}
    .board-row.top2{border-color:rgba(212,168,74,.28)}
    .board-row.top3{border-color:rgba(212,168,74,.18)}
    .board-row.unlinked{opacity:.28}
    .board-rank{font-size:13px;font-weight:700;color:var(--dimmer);width:28px;flex-shrink:0;text-align:center}
    .board-rank.gold{color:#FFD700;font-size:18px}
    .board-rank.silver{color:#C0C0C0;font-size:16px}
    .board-rank.bronze{color:#CD7F32;font-size:15px}
    .board-num{font-family:'Bebas Neue',impact,sans-serif;font-size:15px;color:var(--gold);width:44px;flex-shrink:0;letter-spacing:.04em}
    .board-info{flex:1;min-width:0}
    .board-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .board-city{font-size:11px;color:var(--dimmer);margin-top:1px}
    .board-score{font-size:20px;font-weight:700;color:var(--gold);flex-shrink:0;text-align:right;line-height:1}
    .board-score span{display:block;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer);font-weight:400;margin-top:2px}
    .load-msg{text-align:center;font-size:13px;color:var(--dimmer);padding:40px 20px}

    .demo-notice{max-width:520px;margin:16px auto 0;padding:12px 20px;background:rgba(212,168,74,.05);border:1px solid rgba(212,168,74,.15);border-radius:8px;font-size:12px;color:var(--dim);text-align:center;position:relative;z-index:5}
    .hiw-link{max-width:520px;margin:8px auto 0;padding:0 20px;position:relative;z-index:5;text-align:center}
    .hiw-link a{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dimmer);transition:color .2s}
    .hiw-link a:hover{color:var(--dim)}
  </style>
</head>
<body>

<canvas id="ember-c"></canvas>

<div class="back-bar">
  <a href="/">&#8592; Back to Home</a>
</div>

<div class="hdr">
  <div class="hdr-logo">Set Apart Movement</div>
  <div class="hdr-title">RANKINGS</div>
  <div class="hdr-sub">100 numbers. Every tap counts.</div>
</div>

<div class="search-wrap">
  <input class="search-input" id="search" type="text" placeholder="Search by name or number..." oninput="filterRows()">
</div>

<div class="demo-notice" id="demo-note" hidden>
  Firebase not connected &mdash; showing placeholders. Add apiKey &amp; appId to c.html to see live data.
</div>

<div class="board-wrap" id="board">
  <div class="load-msg" id="load-msg">Loading rankings&hellip;</div>
</div>

<div class="hiw-link">
  <a href="/how-it-works">How does ranking work? &rarr;</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
// ── EMBERS ──
(function(){
  var canvas=document.getElementById('ember-c');
  var ctx=canvas.getContext('2d');
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);
  var embers=[];
  for(var i=0;i<55;i++)embers.push({x:Math.random()*window.innerWidth,y:window.innerHeight+Math.random()*220,vx:(Math.random()-.5)*.5,vy:-.4-Math.random()*.8,r:.6+Math.random()*1.8,life:Math.random(),gold:Math.random()>.3});
  (function draw(){
    var W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);
    embers.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.life-=.0025;if(p.life<=0){p.x=Math.random()*W;p.y=H+10;p.life=.9+Math.random()*.1;p.vx=(Math.random()-.5)*.5;p.vy=-.4-Math.random()*.8;}ctx.globalAlpha=Math.min(p.life,.6)*Math.sin(p.life*Math.PI);ctx.fillStyle=p.gold?'#D4A84A':'rgba(242,238,230,.5)';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;requestAnimationFrame(draw);
  })();
})();

// ── FIREBASE + RANKINGS ──
var FIREBASE_CONFIG = {
  apiKey:            "AIzaSyC5hgApa12EMmn13wSJm4XalNHSqWjwYow",
  authDomain:        "set-apart-movement.firebaseapp.com",
  databaseURL:       "https://set-apart-movement-default-rtdb.firebaseio.com",
  projectId:         "set-apart-movement",
  storageBucket:     "set-apart-movement.firebasestorage.app",
  messagingSenderId: "930831527808",
  appId:             "1:930831527808:web:a1ffd4e0723b1c4a341b65",
  measurementId:     "G-4Y2BS1J1NG"
};

var DEMO_MODE = FIREBASE_CONFIG.apiKey === 'REPLACE_ME';
var allRows = [];

if (DEMO_MODE) {
  document.getElementById('demo-note').hidden = false;
  renderRows({}, true);
} else {
  firebase.initializeApp(FIREBASE_CONFIG);
  var db = firebase.database();
  db.ref('bracelets').on('value', function(snap) {
    var map = {};
    snap.forEach(function(c) { map[c.key] = c.val(); });
    renderRows(map, false);
  });
}

function renderRows(map, demo) {
  var board = document.getElementById('board');
  var loadMsg = document.getElementById('load-msg');
  if (loadMsg) loadMsg.remove();
  var ids = [];
  for (var i = 1; i <= 100; i++) ids.push(String(i).padStart(3,'0'));

  var claimed = ids.filter(function(id){ return map[id] && map[id].name; }).sort(function(a,b){
    return (map[b].tapCount||0) - (map[a].tapCount||0);
  });
  var unclaimed = ids.filter(function(id){ return !map[id] || !map[id].name; });
  var sorted = claimed.concat(unclaimed);

  allRows = sorted.map(function(id, i) {
    var m = map[id];
    var rank = i + 1;
    var rankClass = rank===1?'gold':rank===2?'silver':rank===3?'bronze':'';
    var rankSymbol = rank===1?'&#x1F947;':rank===2?'&#x1F948;':rank===3?'&#x1F949;':rank;
    var rowClass = 'board-row'+(rank<=1?' top1':rank<=2?' top2':rank<=3?' top3':'')+(m&&m.name?'':' unlinked');
    var name = (m && m.name) ? m.name : 'Unclaimed';
    var city = m ? (m.city||'') : '';
    var taps = m ? (m.tapCount||0) : 0;
    return {
      id: id, name: name, html:
        '<div class="'+rowClass+'" data-name="'+name.toLowerCase()+'">' +
        '<div class="board-rank '+rankClass+'">'+rankSymbol+'</div>' +
        '<div class="board-num">#'+id+'</div>' +
        '<div class="board-info"><div class="board-name">'+name+'</div><div class="board-city">'+city+'</div></div>' +
        (m ? '<div class="board-score">'+taps+'<span>taps</span></div>' : '') +
        '</div>'
    };
  });

  board.innerHTML = allRows.map(function(r){return r.html;}).join('');
}

function filterRows() {
  var q = document.getElementById('search').value.toLowerCase().trim();
  var board = document.getElementById('board');
  if (!q) { board.innerHTML = allRows.map(function(r){return r.html;}).join(''); return; }
  var filtered = allRows.filter(function(r){ return r.name.toLowerCase().includes(q) || r.id.includes(q); });
  board.innerHTML = filtered.length ? filtered.map(function(r){return r.html;}).join('') :
    '<div class="load-msg">No results for &ldquo;'+q+'&rdquo;</div>';
}
</script>
<script defer src="https://agency-dashboard-omega-red.vercel.app/t.js"></script>
</body>
</html>
